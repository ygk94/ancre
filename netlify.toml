# Netlify: publish ONLY the built demo screen (app/dist), never the repository itself.
# Without this file Netlify served the raw repo (CLAUDE.md, docs/conseil/, mustdo/...) on 07/10.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Server-side functions (relative to base): /api/funders calls the Alchemy Transfers API with ALCHEMY_API_KEY, a
# Netlify environment variable (Site configuration > Environment variables), never shipped in app/dist.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# single-page app: unknown paths fall back to the screen
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
