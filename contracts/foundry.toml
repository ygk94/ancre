[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Monad gas model (MIP-8 pages, cold account 10 100, EIP-7623 floor). Implies isolate = true:
# every top-level call from a test is priced as its own transaction (21 000 + calldata included).
network = "monad"
gas_limit = "18446744073709551615"
memory_limit = 2147483648
fs_permissions = [{ access = "read", path = "./test/diff/vectors" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "../solver/vectors" }]

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120

[lint]
lint_on_build = false
